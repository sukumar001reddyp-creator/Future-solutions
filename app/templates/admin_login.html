{% extends "base.html" %}
{% block title %}Admin Login | Future Solutions{% endblock %}
{% block content %}
<div class="min-h-[calc(100vh-65px)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-[#EBF8FF] dark:bg-[#0B192C] transition-colors duration-300">
    <div class="max-w-md w-full bg-white/90 dark:bg-[#07111E] border border-blue-200/80 dark:border-blue-900 rounded-3xl p-8 shadow-xl space-y-6">
        
        <div class="text-center space-y-2">
            <span class="bg-blue-600/10 dark:bg-cyan-500/10 border border-blue-500/30 text-blue-700 dark:text-cyan-300 font-semibold text-xs uppercase tracking-widest px-3.5 py-1 rounded-full">
                Restricted Access
            </span>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-[#0B192C] dark:text-white">Admin Portal Login</h2>
            <p class="text-slate-600 dark:text-slate-400 text-xs">Enter your credentials to access the management dashboard.</p>
        </div>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/30 text-red-600 dark:text-red-400 text-xs p-3 rounded-xl text-center font-bold">
            {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('admin_login') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">Username</label>
                <input type="text" name="username" required placeholder="admin" class="w-full bg-[#EBF8FF] dark:bg-[#0B192C] border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-sm text-[#0B192C] dark:text-white focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full bg-[#EBF8FF] dark:bg-[#0B192C] border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-sm text-[#0B192C] dark:text-white focus:outline-none">
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-500/20 text-sm transition-all">
                Login to Dashboard &rarr;
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="{{ url_for('index') }}" class="text-xs text-blue-600 dark:text-cyan-400 hover:underline font-semibold">&larr; Back to Home Page</a>
        </div>
    </div>
</div>
{% endblock %}
