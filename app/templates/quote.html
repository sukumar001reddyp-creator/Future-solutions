{% extends "base.html" %}
{% block title %}Request a Quote | Future Solutions{% endblock %}
{% block content %}
<div class="py-16 bg-[#F0F6FC] dark:bg-[#0B192C] text-[#0B192C] dark:text-slate-100 min-h-[85vh] transition-colors duration-300">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
        
        <div class="text-center mb-12">
            <span class="text-blue-600 dark:text-cyan-400 text-xs font-bold uppercase tracking-widest bg-blue-600/10 dark:bg-cyan-500/10 border border-blue-500/30 dark:border-cyan-400/30 px-3 py-1 rounded-full">
                Instant Quotation
            </span>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-[#0B192C] dark:text-white mt-4 mb-3">
                Request a Freight Quote
            </h1>
            <p class="text-slate-600 dark:text-slate-400 text-sm font-medium">
                Fill out your cargo details below and our logistics experts will get back to you with competitive pricing within 2 hours.
            </p>
        </div>

        <div class="bg-white dark:bg-[#07111E] border border-blue-200 dark:border-blue-900 rounded-2xl p-6 sm:p-8 shadow-xl transition-colors duration-300">
            <form action="{{ url_for('quote') }}" method="POST" class="space-y-6">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-2">Full Name</label>
                        <input type="text" name="full_name" required placeholder="John Doe" 
                            class="w-full bg-[#F0F6FC] dark:bg-[#0B192C] border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-[#0B192C] dark:text-white placeholder-slate-400 focus:outline-none focus:border-blue-600 dark:focus:border-cyan-400 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-2">Business Email</label>
                        <input type="email" name="email" required placeholder="john@company.com" 
                            class="w-full bg-[#F0F6FC] dark:bg-[#0B192C] border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-[#0B192C] dark:text-white placeholder-slate-400 focus:outline-none focus:border-blue-600 dark:focus:border-cyan-400 text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-2">Service Type</label>
                        <select name="service_type" class="w-full bg-[#F0F6FC] dark:bg-[#0B192C] border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-[#0B192C] dark:text-white focus:outline-none focus:border-blue-600 dark:focus:border-cyan-400 text-sm">
                            <option>Ocean Freight (FCL / LCL)</option>
                            <option>Air Cargo Logistics</option>
                            <option>Customs Clearance</option>
                            <option>Warehousing & Storage</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-2">Incoterms</label>
                        <select name="incoterms" class="w-full bg-[#F0F6FC] dark:bg-[#0B192C] border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-[#0B192C] dark:text-white focus:outline-none focus:border-blue-600 dark:focus:border-cyan-400 text-sm">
                            <option>FOB (Free on Board)</option>
                            <option>CIF (Cost, Insurance & Freight)</option>
                            <option>EXW (Ex Works)</option>
                            <option>DDP (Delivered Duty Paid)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-2">Pickup Location / Port</label>
                        <input type="text" name="pickup" required placeholder="e.g. Dubai, UAE" 
                            class="w-full bg-[#F0F6FC] dark:bg-[#0B192C] border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-[#0B192C] dark:text-white placeholder-slate-400 focus:outline-none focus:border-blue-600 dark:focus:border-cyan-400 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-2">Destination Port / Country</label>
                        <input type="text" name="destination" required placeholder="e.g. Kuwait City, Kuwait" 
                            class="w-full bg-[#F0F6FC] dark:bg-[#0B192C] border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-[#0B192C] dark:text-white placeholder-slate-400 focus:outline-none focus:border-blue-600 dark:focus:border-cyan-400 text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-2">Approx Weight (Kg)</label>
                        <input type="number" name="weight" placeholder="e.g. 1500" 
                            class="w-full bg-[#F0F6FC] dark:bg-[#0B192C] border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-[#0B192C] dark:text-white placeholder-slate-400 focus:outline-none focus:border-blue-600 dark:focus:border-cyan-400 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-2">Approx Volume (CBM)</label>
                        <input type="number" name="volume" placeholder="e.g. 12" 
                            class="w-full bg-[#F0F6FC] dark:bg-[#0B192C] border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-[#0B192C] dark:text-white placeholder-slate-400 focus:outline-none focus:border-blue-600 dark:focus:border-cyan-400 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-2">Cargo Description & Special Instructions</label>
                    <textarea name="description" rows="4" placeholder="Provide details about cargo type, dimensions, hazardous status, etc." 
                        class="w-full bg-[#F0F6FC] dark:bg-[#0B192C] border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-[#0B192C] dark:text-white placeholder-slate-400 focus:outline-none focus:border-blue-600 dark:focus:border-cyan-400 text-sm"></textarea>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/20 transition-all text-base tracking-wide">
                    Submit Quotation Request &rarr;
                </button>
            </form>
        </div>

    </div>
</div>
{% endblock %}
