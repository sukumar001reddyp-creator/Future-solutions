{% extends "base.html" %}
{% block title %}Request a Quote | Future Solutions{% endblock %}
{% block content %}
<div class="py-16 bg-brand-dark min-h-[85vh]">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
        
        <div class="text-center mb-12">
            <span class="text-brand-gold text-xs font-semibold uppercase tracking-widest bg-brand-gold/10 border border-brand-gold/20 px-3 py-1 rounded-full">
                Instant Quotation
            </span>
            <h1 class="text-3xl sm:text-4xl font-bold text-white mt-4 mb-3">
                Request a Freight Quote
            </h1>
            <p class="text-slate-400 text-sm">
                Fill out your cargo details below and our logistics experts will get back to you with competitive pricing within 2 hours.
            </p>
        </div>

        <div class="bg-brand-card border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-xl">
            <form action="{{ url_for('quote') }}" method="POST" class="space-y-6">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Full Name</label>
                        <input type="text" name="full_name" required placeholder="John Doe" 
                            class="w-full bg-[#070D1D] border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-brand-gold text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Business Email</label>
                        <input type="email" name="email" required placeholder="john@company.com" 
                            class="w-full bg-[#070D1D] border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-brand-gold text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Service Type</label>
                        <select name="service_type" class="w-full bg-[#070D1D] border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-gold text-sm">
                            <option>Ocean Freight (FCL / LCL)</option>
                            <option>Air Cargo Logistics</option>
                            <option>Customs Clearance</option>
                            <option>Warehousing & Storage</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Incoterms</label>
                        <select name="incoterms" class="w-full bg-[#070D1D] border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-gold text-sm">
                            <option>FOB (Free on Board)</option>
                            <option>CIF (Cost, Insurance & Freight)</option>
                            <option>EXW (Ex Works)</option>
                            <option>DDP (Delivered Duty Paid)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Pickup Location / Port</label>
                        <input type="text" name="pickup" required placeholder="e.g. Dubai, UAE" 
                            class="w-full bg-[#070D1D] border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-brand-gold text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Destination Port / Country</label>
                        <input type="text" name="destination" required placeholder="e.g. Kuwait City, Kuwait" 
                            class="w-full bg-[#070D1D] border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-brand-gold text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Approx Weight (Kg)</label>
                        <input type="number" name="weight" placeholder="e.g. 1500" 
                            class="w-full bg-[#070D1D] border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-brand-gold text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Approx Volume (CBM)</label>
                        <input type="number" name="volume" placeholder="e.g. 12" 
                            class="w-full bg-[#070D1D] border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-brand-gold text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Cargo Description & Special Instructions</label>
                    <textarea name="description" rows="4" placeholder="Provide details about cargo type, dimensions, hazardous status, etc." 
                        class="w-full bg-[#070D1D] border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-brand-gold text-sm"></textarea>
                </div>

                <button type="submit" class="w-full bg-brand-gold hover:bg-brand-goldHover text-brand-dark font-bold py-4 rounded-xl transition-all shadow-lg shadow-brand-gold/10 text-base">
                    Submit Quotation Request
                </button>
            </form>
        </div>

    </div>
</div>
{% endblock %}
